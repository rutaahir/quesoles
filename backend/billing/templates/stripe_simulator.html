<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Checkout Simulator | Quesole</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #22c55e;
            --success-hover: #16a34a;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .checkout-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.025em;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        .badge {
            background-color: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 9999px;
            display: inline-block;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .summary-card {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }

        .label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .value {
            font-weight: 600;
            font-size: 14px;
        }

        .total-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-sizing: border-box;
            display: block;
            text-decoration: none;
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        .btn-danger {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: var(--danger);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="header">
            <span class="badge">Local Sandbox Simulator</span>
            <h1>Secure Checkout</h1>
            <p>Mock Payment Gateway Integration</p>
        </div>

        <div class="summary-card">
            <div class="summary-row">
                <span class="label">Product Plan</span>
                <span class="value" id="plan-name">{{ package_name }}</span>
            </div>
            <div class="summary-row">
                <span class="label">Billing Cycle</span>
                <span class="value" id="billing-cycle">{{ billing_cycle }}</span>
            </div>
            <div class="summary-row">
                <span class="label">Total Due</span>
                <span class="total-price" id="total-price">${{ price }} USD</span>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-success" id="btn-pay" onclick="simulatePayment(true)">Simulate Successful Payment</button>
            <button class="btn btn-danger" id="btn-fail" onclick="simulatePayment(false)">Simulate Payment Failure</button>
        </div>

        <div class="loading" id="loading-spinner">
            <div class="spinner"></div>
            <p id="loading-text">Processing simulation transaction...</p>
        </div>
    </div>

    <script>
        const sessionId = "{{ session_id }}";
        const companyId = "{{ company_id }}";
        const packageId = "{{ package_id }}";
        const billingCycle = "{{ billing_cycle }}";
        const priceCents = {{ price_cents }};
        const successUrl = "{{ success_url }}";
        const cancelUrl = "{{ cancel_url }}";

        function simulatePayment(isSuccess) {
            document.getElementById("btn-pay").disabled = true;
            document.getElementById("btn-fail").disabled = true;
            document.getElementById("loading-spinner").style.display = "block";

            if (isSuccess) {
                // Construct mock Stripe Webhook event structure
                const payload = {
                    id: "evt_sim_" + Math.random().toString(36).substr(2, 9),
                    type: "checkout.session.completed",
                    data: {
                        object: {
                            id: sessionId,
                            client_reference_id: companyId,
                            customer: "cus_sim_" + Math.random().toString(36).substr(2, 9),
                            subscription: "sub_sim_" + Math.random().toString(36).substr(2, 9),
                            payment_status: "paid",
                            amount_total: priceCents,
                            currency: "usd",
                            metadata: {
                                package_id: packageId,
                                billing_cycle: billingCycle
                            }
                        }
                    }
                };

                // Post directly to the local webhook path
                fetch("/api/billing/webhook/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        // Send a mock stripe signature header that the view knows is mock
                        "Stripe-Signature": "t=" + Math.floor(Date.now()/1000) + ",v1=mock_signature_for_simulation"
                    },
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = successUrl + "?session_id=" + sessionId;
                    } else {
                        return response.json().then(err => {
                            alert("Simulation error: " + (err.error || "Failed to trigger webhook"));
                            resetButtons();
                        });
                    }
                })
                .catch(err => {
                    alert("Simulation network error: " + err);
                    resetButtons();
                });
            } else {
                // Redirect straight to cancellation handler
                window.location.href = cancelUrl;
            }
        }

        function resetButtons() {
            document.getElementById("btn-pay").disabled = false;
            document.getElementById("btn-fail").disabled = false;
            document.getElementById("loading-spinner").style.display = "none";
        }
    </script>
</body>
</html>
