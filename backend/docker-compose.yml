version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: queuing_solutions_db
    restart: always
    environment:
      MYSQL_DATABASE: queuing_solutions
      MYSQL_ROOT_PASSWORD: root@123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    container_name: queuing_solutions_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
